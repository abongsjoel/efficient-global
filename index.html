    <title>Efficient Global</title>
    <script>
      (function (location) {
        if (location.search[1] !== "/") {
          return;
        }

        const decodedPath = location.search
          .slice(1)
          .split("&")
          .map((segment) => segment.replace(/~and~/g, "&"))
          .join("?");

        window.history.replaceState(
          null,
          "",
          location.pathname.slice(0, -1) + decodedPath + location.hash,
        );
      })(window.location);
    </script>
